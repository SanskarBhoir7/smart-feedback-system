[pytest]
# Only the unit/integration suite runs by default.
#
# integration_tests/ is deliberately excluded: those tests talk to the
# DEPLOYED Docker container over real HTTP, so they need it to be running.
# Jenkins runs them in their own stage straight after deployment:
#
#     python -m pytest integration_tests
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows a short summary of anything that is not a plain pass.
addopts = -ra --strict-markers --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
