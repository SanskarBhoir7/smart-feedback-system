[pytest]
# Only the unit/integration suite runs by default. selenium_tests/ is
# deliberately excluded: those need a running server and a real browser, so
# Jenkins runs them in a separate stage after deployment.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra shows a short summary of anything that is not a plain pass.
addopts = -ra --strict-markers --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
