{% extends "base.html" %}
{% block title %}{{ code }} - Smart Feedback System{% endblock %}

{% block content %}
<section class="card error-card">
    <div class="error-code" id="error_code">{{ code }}</div>
    <p class="error-message" id="error_message">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('index') }}">Back to Feedback</a>
</section>
{% endblock %}
